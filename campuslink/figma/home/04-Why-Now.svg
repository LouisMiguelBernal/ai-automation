<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="364" viewBox="0 0 1440 364">
<defs></defs>
<rect width="1440" height="364" fill="#ffffff"/>
<rect x="0" y="0" width="1440" height="364" fill="#ebeff6"/>
<text x="160.0" y="84.0" font-family="Figtree" font-size="30" font-weight="700" fill="#0e3b7d">Why now</text>
<text x="160.0" y="121.1" font-family="Figtree" font-size="16" font-weight="400" fill="#33373d">Title I districts must reserve</text>
<text x="361.5" y="121.1" font-family="Figtree" font-size="16" font-weight="700" fill="#33373d">at least 1% of their allocation</text>
<text x="576.6" y="121.1" font-family="Figtree" font-size="16" font-weight="400" fill="#33373d">for parent and</text>
<text x="160.0" y="145.1" font-family="Figtree" font-size="16" font-weight="400" fill="#33373d">family engagement (when that 1% exceeds $5,000), and send</text>
<text x="604.6" y="145.1" font-family="Figtree" font-size="16" font-weight="700" fill="#33373d">at least 90%</text>
<text x="160.0" y="169.1" font-family="Figtree" font-size="16" font-weight="400" fill="#33373d">of it to schools. They also need a family engagement policy, a school-parent</text>
<text x="160.0" y="193.1" font-family="Figtree" font-size="16" font-weight="400" fill="#33373d">compact and an annual meeting, with proof. Today, much of that proof is</text>
<text x="160.0" y="217.1" font-family="Figtree" font-size="16" font-weight="400" fill="#33373d">paper sign-in sheets.</text>
<text x="160.0" y="257.1" font-family="Figtree" font-size="16" font-weight="600" fill="#0062ad" text-decoration="underline">20 U.S.C. § 6318 (ESSA §1116)</text>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0062ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="379.625" y="244"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>
<rect x="736" y="56" width="544" height="76" fill="#ffffff"/>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e3b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="752" y="74"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"></path><path d="M7 21h10"></path><path d="M12 3v18"></path><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"></path></svg>
<text x="792.0" y="89.1" font-family="Figtree" font-size="16" font-weight="700" fill="#0e3b7d">Required budget already exists</text>
<text x="792.0" y="110.4" font-family="Figtree" font-size="14" font-weight="400" fill="#5f6873">No new money to find, just a place to spend required funds well.</text>
<rect x="736" y="144" width="544" height="76" fill="#ffffff"/>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e3b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="752" y="162"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg>
<text x="792.0" y="177.1" font-family="Figtree" font-size="16" font-weight="700" fill="#0e3b7d">Families speak many languages</text>
<text x="792.0" y="198.4" font-family="Figtree" font-size="14" font-weight="400" fill="#5f6873">Built-in translation; human translation via 806 Translations.</text>
<rect x="736" y="232" width="544" height="76" fill="#ffffff"/>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0e3b7d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" x="752" y="250"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
<text x="792.0" y="265.1" font-family="Figtree" font-size="16" font-weight="700" fill="#0e3b7d">Parents are a new user for 806</text>
<text x="792.0" y="286.4" font-family="Figtree" font-size="14" font-weight="400" fill="#5f6873">Complements Title1Crate instead of overlapping it.</text>
</svg>
