<text x="353.1" y="327.4" font-family="Figtree" font-size="14" font-weight="400" fill="#33373d">Adds two-way translated messaging, conferences, e-sign compacts, surveys</text>
<text x="1056.0" y="327.4" font-family="Figtree" font-size="14" font-weight="400" fill="#5f6873">$450 per school / year</text>
