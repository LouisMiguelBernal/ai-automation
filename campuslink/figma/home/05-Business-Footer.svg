<text x="177.0" y="371.4" font-family="Figtree" font-size="14" font-weight="700" fill="#0e3b7d">Professional</text>
<text x="353.1" y="371.4" font-family="Figtree" font-size="14" font-weight="400" fill="#33373d">Adds event promotion, analytics, AI evidence check, board reports</text>
<text x="1056.0" y="371.4" font-family="Figtree" font-size="14" font-weight="400" fill="#5f6873">$600 per school / year</text>
