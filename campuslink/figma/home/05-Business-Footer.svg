<text x="353.1" y="283.4" font-family="Figtree" font-size="14" font-weight="400" fill="#33373d">Event pages, RSVP, QR check-in, attendance filed to Title1Crate</text>
<text x="1056.0" y="283.4" font-family="Figtree" font-size="14" font-weight="400" fill="#5f6873">$300 per school / year</text>
